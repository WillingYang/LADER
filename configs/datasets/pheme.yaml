dataset:
  name: pheme
  data_root: /data3/pheme
  splits:
    train: pheme_train.csv
    test: pheme_test.csv
  image_root: images
  id_column: mid
  image_id_column: imgnum
  image_path_column:
  text_column: text
  fallback_text_column:
  label_column: label
  metadata_fields:
    - mid
    - imgnum
    - text
    - event
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
    - .gif
  output_label_map:
    0: real
    1: fake
